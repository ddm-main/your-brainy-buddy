[run]
# Preview runs the root Vite React app. Builds must also use Vite; copying
# Apps/hud/public served the old one-word placeholder instead of JARVIS.
dev = "sh -c 'npm ci && PORT=8080 HUD_HOST=0.0.0.0 node Apps/hud/server.mjs'"
"build:dev" = "sh -c 'npm ci && npm run build:dev'"
build = "sh -c 'npm ci && npm run build'"
